# =============================================================================
# ArgoCD — Application BeeWAF pour cluster DPC existant
# =============================================================================
# Ce manifest configure ArgoCD pour gérer BeeWAF sur le cluster DPC
# ArgoCD est déjà installé dans le namespace 'argocd'
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beewaf
  namespace: argocd
  labels:
    app.kubernetes.io/name: beewaf
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    # Repository Git contenant les manifests K8s
    # À adapter avec votre repo Git
    repoURL: https://github.com/votre-org/beewaf-k8s-manifests.git
    targetRevision: main
    path: overlays/prod
    
    # Configuration Kustomize
    kustomize:
      namePrefix: ''
      commonLabels:
        environment: production
        managed-by: argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: beewaf
  
  syncPolicy:
    # Sync automatique avec prune et self-heal
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=false  # Namespace existe déjà
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Ignorer les différences sur certains champs
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations/kubectl.kubernetes.io/restartedAt
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  
  info:
    - name: 'Environment'
      value: 'Production DPC'
    - name: 'Cluster'
      value: 'testhamaster1-3 + testhaworker1-2'
    - name: 'Version K8s'
      value: 'v1.29.15'
