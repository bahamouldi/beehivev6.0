# =============================================================================
# BeeWAF — Service (Base)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: beewaf-svc
  labels:
    app: beewaf
spec:
  selector:
    app: beewaf
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
