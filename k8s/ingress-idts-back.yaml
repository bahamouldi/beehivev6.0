# =============================================================================
# BeeWAF — Ingress pour protéger idts-back (Spring Boot)
# Architecture: Internet → HAProxy → Ingress → BeeWAF → idts-back
#
# Cet Ingress route le trafic idts.back.dpc.com.tn vers BeeWAF
# qui filtre les attaques et forward vers idts-back
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idts-back-via-waf
  namespace: beewaf
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/forwarded-for-header: "X-Forwarded-For"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - idts.back.dpc.com.tn
    secretName: beewaf-idts-tls
  rules:
  - host: idts.back.dpc.com.tn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beewaf-svc
            port:
              number: 80
